name: Build MechaniQ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Yeh step GitHub ki chaabi ko permanent (lock) kar dega taaki baar-baar change na ho
      - name: Cache Android Keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: mechaniq-keystore-permanent-v1

      - name: The Ultimate Android Master Reset
        run: |
          echo "1. Backing up your custom Manifest..."
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          
          echo "2. Nuking the old Android architecture..."
          rm -rf android/
          
          echo "3. Auto-generating modern Android folder..."
          flutter create --platforms=android .
          
          echo "4. Restoring Manifest permissions..."
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          
          echo "5. Fixing package name..."
          find android -type f -exec sed -i 's/com.example.mechaniq/com.mechaniq.app/g' {} +

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # Yeh step aapko Firebase mein daalne ke liye SHA-1 aur SHA-256 nikal kar dega!
      - name: Print Firebase SHA-1 and SHA-256 Keys
        run: |
          echo "========================================================"
          echo "🔥 COPY THESE KEYS TO YOUR FIREBASE CONSOLE 🔥"
          echo "========================================================"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "========================================================"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechaniQ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
