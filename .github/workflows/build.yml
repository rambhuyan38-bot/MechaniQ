name: Build MechaniQ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Magic Fix for Android V1 Error
        run: |
          echo "Scanning and fixing all Android files automatically..."
          
          # 1. पुरानी Java फाइलों का कचरा साफ करना
          find android -name "*.java" -type f -delete
          
          # 2. Kotlin फाइल में सही V2 कोड अपडेट करना
          find android -name "*.kt" -type f -exec sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' {} +
          
          # 3. Manifest में V2 टैग लगाना
          find android -name "AndroidManifest.xml" -type f -exec sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' {} +
          
          # 4. अगर flutterEmbedding लाइन मिसिंग है, तो उसे ऑटोमैटिकली डालना
          if ! grep -q 'android:name="flutterEmbedding"' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/application>/i \        <meta-data android:name="flutterEmbedding" android:value="2" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Clean and Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechaniQ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
