name: Build MechaniQ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: The Ultimate Android Master Reset
        run: |
          echo "1. Backing up your custom Manifest (Bluetooth & OBD Permissions)..."
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          
          echo "2. Nuking the old, broken Android architecture..."
          rm -rf android/
          
          echo "3. Letting Flutter auto-generate a 100% perfect, modern Android folder..."
          flutter create --platforms=android .
          
          echo "4. Restoring your Manifest permissions..."
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          echo "5. Fixing package name for Play Store compatibility..."
          find android -type f -exec sed -i 's/com.example.mechaniq/com.mechaniq.app/g' {} +

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechaniQ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
