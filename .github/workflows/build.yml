name: MechaniQ Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Flutter
      # IMPORTANT:
      # Do NOT use "stable" without a version.
      # This prevents GitHub from silently moving to a
      # newer Flutter Gradle toolchain.
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 4. Verify toolchain
      # ---------------------------------------------------------
      - name: Flutter doctor
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # ---------------------------------------------------------
      # 5. Get dependencies
      # ---------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ---------------------------------------------------------
      # 6. Clean old generated/build files
      # ---------------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      # ---------------------------------------------------------
      # 7. Get dependencies again after clean
      # ---------------------------------------------------------
      - name: Flutter pub get after clean
        run: flutter pub get

      # ---------------------------------------------------------
      # 8. Build Release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # ---------------------------------------------------------
      # 9. Upload APK
      # ---------------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MechaniQ-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
