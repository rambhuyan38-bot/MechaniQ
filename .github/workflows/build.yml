name: Build MechaniQ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Android Keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: mechaniq-keystore-permanent-v1

      - name: The Ultimate Android Master Reset
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          rm -rf android/
          flutter create --platforms=android .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          find android -type f -exec sed -i 's/com.example.mechaniq/com.mechaniq.app/g' {} +

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechaniQ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Print Firebase Keys Directly From APK
        run: |
          echo "========================================================"
          echo "🔥 COPY THESE KEYS TO YOUR FIREBASE CONSOLE 🔥"
          echo "========================================================"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true
          echo "========================================================"
